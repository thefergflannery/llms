  <script>
    var SUPABASE_URL = 'https://lrlkptqzaddxskoikzqs.supabase.co';
    var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxybGtwdHF6YWRkeHNrb2lrenFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODg5NzIsImV4cCI6MjA5NDc2NDk3Mn0.gF0IUWlY1kLZ5rw8PTx7WZjRiBDUlbzaQDj6Db_mLdM';
    var AUTH_KEY = 'pinic:auth';

    // Redirect if already signed in
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem(AUTH_KEY));
        if (stored && stored.access_token && Date.now() < stored.expires_at - 10000) {
          redirect();
        }
      } catch (e) {}
    })();

    function redirect() {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || '/dashboard';
      window.location.href = next.startsWith('/') ? next : '/dashboard';
    }

    function showError(msg) {
      var el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.add('visible');
    }

    function hideError() {
      document.getElementById('authError').classList.remove('visible');
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideError();

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('submitBtn');

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Signing in…';

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (!res.ok) {
          var msg = (data && data.error_description) || (data && data.message) || 'Sign in failed. Check your email and password.';
          showError(msg);
          btn.disabled = false;
          btn.innerHTML = 'Sign in';
          return;
        }

        var stored = {
          access_token: data.access_token,
          refresh_token: data.refresh_token,
          expires_at: Date.now() + data.expires_in * 1000,
          user: { id: data.user.id, email: data.user.email }
        };
        localStorage.setItem(AUTH_KEY, JSON.stringify(stored));

        posthog.identify(data.user.id, { email: data.user.email });
        posthog.capture('dashboard_signed_in', { email: data.user.email });

        redirect();
      } catch (err) {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.innerHTML = 'Sign in';
      }
    });
  </script>
